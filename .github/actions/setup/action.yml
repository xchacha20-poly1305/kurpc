name: Set up kurpc build
description: >-
  Rust toolchain from rust-toolchain.toml, JDK 21, Gradle, and optionally zig and the Android NDK.
inputs:
  ndk:
    description: Install the NDK version pinned in gradle/libs.versions.toml.
    default: "false"
  zig:
    description: Install zig and cargo-zigbuild for cross compilation.
    default: "false"
runs:
  using: composite
  steps:
    - name: Rust toolchain
      shell: bash
      # Installs the channel, components and targets listed in rust-toolchain.toml.
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@v2
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle
    - uses: actions/setup-node@v6
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: web-bridge/package-lock.json
    - name: Android NDK
      if: inputs.ndk == 'true'
      shell: bash
      # Runner images pick up new NDKs only after a staged rollout, so the build cannot rely on
      # the pinned version being preinstalled. sdkmanager returns at once when it already is.
      run: |
        version=$(sed -n 's/^ndk = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$version" > /dev/null
    - uses: mlugg/setup-zig@v2
      if: inputs.zig == 'true'
      with:
        version: 0.17.0
    - name: cargo-zigbuild
      if: inputs.zig == 'true'
      shell: bash
      # 0.24.0 includes the macOS linker argument fix for zig 0.16 (plan §6.2).
      run: cargo install cargo-zigbuild --locked --version 0.24.0
