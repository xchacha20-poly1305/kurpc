name: Set up kurpc build
description: >-
  Rust toolchain from rust-toolchain.toml, JDK 21, Gradle, and optionally zig and the Android NDK.
inputs:
  ndk:
    description: Install the NDK version pinned in gradle/libs.versions.toml.
    default: "false"
  zig:
    description: Install zig and the cargo-zigbuild revision that links macOS targets.
    default: "false"
runs:
  using: composite
  steps:
    - name: Rust toolchain
      shell: bash
      # Installs the channel, components and targets listed in rust-toolchain.toml.
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@v2
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle
    - name: Android NDK
      if: inputs.ndk == 'true'
      shell: bash
      # Runner images pick up new NDKs only after a staged rollout, so the build cannot rely on
      # the pinned version being preinstalled. sdkmanager returns at once when it already is.
      run: |
        version=$(sed -n 's/^ndk = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$version" > /dev/null
    - uses: mlugg/setup-zig@v2
      if: inputs.zig == 'true'
      with:
        version: 0.16.0
    - name: cargo-zigbuild
      if: inputs.zig == 'true'
      shell: bash
      # 0.23.4 splits Apple linker arguments under zig 0.16 (cargo-zigbuild#479); the fix is
      # on master only (plan §6.2).
      run: >-
        cargo install cargo-zigbuild --locked
        --git https://github.com/rust-cross/cargo-zigbuild
        --rev d9f7fd32fbac13cc26d23847835f7f23a5ed3a25
