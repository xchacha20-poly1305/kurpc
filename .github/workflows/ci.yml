name: CI

on:
  push:
    branches: [dev]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # jvmTest on JDK 21 and (provisioned) JDK 8, Android Lint, ABI dump, generated stubs.
      - run: ./gradlew :kurpc:check :protoc-gen-kurpc:check

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          zig: "true"
          ndk: "true"
      - run: ./gradlew -Pkurpc.targets=all :kurpc:nativesJars :kurpc:assemble
      - run: tar -C kurpc/build -czf natives.tar.gz natives-release jniLibs/main
      - uses: actions/upload-artifact@v7
        with:
          name: natives
          if-no-files-found: error
          path: natives.tar.gz

  platform-test:
    strategy:
      fail-fast: false
      matrix:
        # Real Unix sockets on macOS and Windows, plus Windows named pipes.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo test --workspace
      - run: ./gradlew :kurpc:jvmTest :kurpc:jvmTestJava8

  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 21
            arch: x86
          - api: 35
            arch: x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          ndk: "true"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Only the emulator's ABI: the device-test APK carries a test server per selected ABI.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          script: ./gradlew -Pkurpc.targets=android-${{ matrix.arch }} :kurpc:connectedAndroidDeviceTest

  snapshot:
    needs: [check, cross, platform-test, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: natives
      - name: Publish snapshot
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [[ "$version" != *-SNAPSHOT ]]; then
            echo "Skipping snapshot publication for $version"
            exit 0
          fi
          mkdir -p prebuilt-natives
          tar -xzf natives.tar.gz -C prebuilt-natives
          ./gradlew -Pkurpc.targets=all \
            -Pkurpc.prebuiltNatives="$GITHUB_WORKSPACE/prebuilt-natives" \
            publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: "F22FA56A"
