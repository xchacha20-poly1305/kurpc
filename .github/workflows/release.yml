name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # gradle.properties holds the version; the tag only triggers the release and must agree.
      - run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version=$version in gradle.properties"
            exit 1
          fi
      - uses: ./.github/actions/setup
        with:
          zig: "true"
          ndk: "true"
      # Every target cross-compiles from Linux, so one job builds and publishes everything.
      # The release task also publishes the Central Portal deployment; the plain upload task
      # would leave it waiting for a manual release.
      - run: >-
          ./gradlew -Pkurpc.targets=all
          :kurpc:check :protoc-gen-kurpc:check publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: 0CDBE971
