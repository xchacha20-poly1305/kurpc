syntax = "proto3";

package kurpc.wiretest.packaged;

import "wire/extensions.proto";

// Wire prefers its own option to java_package.
option java_package = "io.github.xchacha20_poly1305.kurpc.wire.wiretest.ignored";
option (wire.wire_package) = "io.github.xchacha20_poly1305.kurpc.wire.wiretest.renamed";

message Renamed {
  string text = 1;
}

service WirePackage {
  rpc Echo(Renamed) returns (Renamed);
}
