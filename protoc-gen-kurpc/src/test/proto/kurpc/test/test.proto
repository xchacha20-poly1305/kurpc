syntax = "proto3";

package kurpc.test;

// No java_multiple_files: messages nest in the file class, which is TestOuterClass because the
// service is also named Test.
option java_package = "io.github.xchacha20_poly1305.kurpc.protoc.test";

message Payload {
  string text = 1;
}

// The methods of kurpc-testserver that answer with what they receive.
service Test {
  // Returns the request.
  rpc Echo(Payload) returns (Payload);

  // Echoes every message.
  rpc Chat(stream Payload) returns (stream Payload);

  rpc Count(Payload) returns (stream Payload);

  rpc Collect(stream Payload) returns (Payload);
}
