syntax = "proto3";

package kurpc.wiretest;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

// Wire has no file class: the messages are top-level classes of this package.
option java_package = "io.github.xchacha20_poly1305.kurpc.protoc.wiretest";

message Outer {
  message Inner {
    string text = 1;
  }

  Inner content = 1;
}

service WireNames {
  rpc Nested(Outer.Inner) returns (Outer);

  rpc Chat(stream Outer.Inner) returns (stream Outer.Inner);

  // Wire generates no class for these: Empty is Unit, a wrapper its nullable value.
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);

  rpc Wrapped(google.protobuf.StringValue) returns (google.protobuf.StringValue);
}
